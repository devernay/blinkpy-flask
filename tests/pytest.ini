[tool:pytest]
filterwarnings =
    ignore::RuntimeWarning:.*coroutine.*was never awaited
    ignore::DeprecationWarning:.*return a value that is not None from a test case
collect_ignore =
    test_app.py
    test_critical_coverage.py
    test_coverage_boost.py
    test_initialization.py
    test_route_decorators.py
    test_advanced_coverage.py
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    slow: marks tests as slow (deselected with -m 'not slow')
    integration: marks tests as integration tests
    skip_hanging: marks tests that hang due to refactoring issues
