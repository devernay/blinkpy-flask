[tool:pytest]
# Pytest configuration for Blink Flask application

# Test discovery
testpaths = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage options (when using pytest-cov)
# Run with: pytest --cov=app --cov-report=html --cov-report=term
