[tool:pytest]
# Standard pytest configuration - only recurse in tests directory
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
timeout = 10
timeout_method = signal
addopts = --timeout=10 --tb=short --cov=blinkapp --cov-report=term-missing --cov-config=tests/.coveragerc
asyncio_mode = auto
filterwarnings =
    ignore::RuntimeWarning:.*coroutine.*AsyncMockMixin.*never awaited
    ignore:coroutine.*AsyncMockMixin.*never awaited:RuntimeWarning
markers =
    core: Core application tests (test_app.py)
    critical: Critical coverage tests (test_critical_coverage.py)
    boost: Coverage boost tests (test_coverage_boost.py)
    advanced: Advanced coverage tests
