[tool:pytest]
# Pytest configuration for Blink Flask application

# Test discovery - run all test files by default
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude patterns
norecursedirs = blinkpy .git .tox dist build *.egg

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --durations=10

# Coverage options (when using pytest-cov)
# Run with: pytest --cov=blinkapp --cov-report=html --cov-report=term

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
