<!DOCTYPE html>
<html>
<head>
    <title>Clips - Blink Camera</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <div id="clips-container">
        <!-- Clips will be loaded here -->
    </div>
    
    <script>
        // SSE connection for real-time thumbnail updates
        const eventSource = new EventSource('/stream?channel=thumbnails');
        
        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.type === 'thumbnail_ready') {
                updateClipThumbnail(data.clip_id, data.url);
            }
        };
        
        function updateClipThumbnail(clipId, thumbnailUrl) {
            const clipElement = document.querySelector(`[data-clip-id="${clipId}"]`);
            if (clipElement) {
                const img = clipElement.querySelector('.clip-thumbnail');
                if (img) {
                    img.src = thumbnailUrl;
                    img.style.display = 'block';
                    // Hide play button placeholder
                    const playButton = clipElement.querySelector('.play-button-placeholder');
                    if (playButton) {
                        playButton.style.display = 'none';
                    }
                }
            }
        }
        
        // Check for existing thumbnails when page loads
        function checkExistingThumbnails() {
            const clipElements = document.querySelectorAll('[data-clip-id]');
            clipElements.forEach(element => {
                const clipId = element.getAttribute('data-clip-id');
                fetch(`/api/clip/${clipId}/thumbnail/check`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.success && data.data.available) {
                            updateClipThumbnail(clipId, data.data.url);
                        }
                    })
                    .catch(error => console.log('Thumbnail check failed:', error));
            });
        }
        
        // Call when clips are loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Wait a bit for clips to load, then check thumbnails
            setTimeout(checkExistingThumbnails, 1000);
        });
        
        // Also check when new clips are added dynamically
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'childList') {
                    mutation.addedNodes.forEach(function(node) {
                        if (node.nodeType === 1 && node.hasAttribute('data-clip-id')) {
                            const clipId = node.getAttribute('data-clip-id');
                            setTimeout(() => {
                                fetch(`/api/clip/${clipId}/thumbnail/check`)
                                    .then(response => response.json())
                                    .then(data => {
                                        if (data.success && data.data.available) {
                                            updateClipThumbnail(clipId, data.data.url);
                                        }
                                    })
                                    .catch(error => console.log('Thumbnail check failed:', error));
                            }, 100);
                        }
                    });
                }
            });
        });
        
        observer.observe(document.body, {
            childList: true,
            subtree: true
        });
    </script>
</body>
</html>
