[tool.ruff]
# Ruff configuration for Blink Flask application
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B007", # loop control variable not used (common pattern)
]

[tool.pyright]
# Python version and environment
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

# Include and exclude paths
include = ["blinkapp", "tests"]
exclude = [
    "**/__pycache__",
    "venv",
    ".venv",
    "cache",
    "blinkpy-source"
]

# Type checking mode
typeCheckingMode = "standard"

# Use type stubs for blinkpy
stubPath = "types-blinkpy"

# Ignore third-party library issues
reportMissingImports = false
reportMissingTypeStubs = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["blinkapp", "blink_connection", "stream_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["blinkpy-source", ".git", "__pycache__", ".pytest_cache"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 10
timeout_method = "signal"
addopts = "--timeout=10 --tb=short --cov=blinkapp --cov-report=term-missing --cov-config=tests/.coveragerc --ignore=blinkpy-source"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "core: Core application tests (test_app.py)",
    "critical: Critical coverage tests (test_critical_coverage.py)",
    "boost: Coverage boost tests (test_coverage_boost.py)",
    "advanced: Advanced coverage tests"
]
filterwarnings = [
    'ignore:configuration option "asyncio_default_fixture_loop_scope" is unset',
]
