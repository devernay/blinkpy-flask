[tool.ruff]
# Ruff configuration for Blink Flask application
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "D",   # pydocstyle (docstring enforcement)
    "ANN", # flake8-annotations (type hint enforcement)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B007",   # loop control variable not used (common pattern)
    "D100",   # missing docstring in public module (allow module-level docstrings to be optional)
    "D104",   # missing docstring in public package (allow package-level docstrings to be optional)
    "ANN401", # dynamically typed expressions (Any) are disallowed
]

# IMPORTANT: Import/Export Restrictions Required by Specification
# - Modules MUST NOT re-export imported symbols via __all__
# - Only symbols defined in the module should be in __all__
# - Unused imports MUST be removed, not added to __all__
# - This enforces clean module boundaries and prevents circular dependencies

# Docstring configuration
[tool.ruff.lint.pydocstyle]
convention = "google"  # Enforce Google-style docstrings

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py files only if they're re-exported
"__init__.py" = []
# Relax requirements for test files (except test_base.py)
"tests/test_*.py" = [
    "D",      # Skip all docstring requirements
    "ANN",    # Skip all type annotation requirements
]
# Keep strict requirements for test_base.py
"tests/test_base.py" = []

[tool.pyright]
# Python version and environment
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

# Include and exclude paths
include = ["blinkapp", "tests"]
exclude = [
    "**/__pycache__",
    "venv",
    ".venv",
    "cache",
    "blinkpy-source"
]

# Type checking mode
typeCheckingMode = "standard"

# IMPORTANT: Import/Export Restrictions Required by Specification
# - reportPrivateImportUsage enforces that private symbols are not imported
# - This prevents importing symbols not in __all__ from other modules
# - Maintains clean module boundaries and API contracts
reportPrivateImportUsage = "error"
reportImplicitStringConcatenation = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"

# Type hint enforcement
reportMissingTypeAnnotation = "error"        # Require type hints on all functions
reportMissingParameterType = "error"         # Require type hints on all parameters
reportMissingReturnType = "error"            # Require return type hints
reportUnknownParameterType = "error"         # Flag unknown parameter types
reportUnknownVariableType = "error"          # Flag unknown variable types
reportUnknownMemberType = "warning"          # Flag unknown member types

# Use type stubs for blinkpy
stubPath = "types-blinkpy"

# Ignore third-party library issues
reportMissingImports = false
reportMissingTypeStubs = false

# Per-file type checking configuration - relax for test files except test_base.py
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["blinkapp"]
# Keep these relaxed - they're reasonable for test files
reportMissingTypeAnnotation = false
reportMissingParameterType = false
reportMissingReturnType = false
# Keep these relaxed - needed for test frameworks and mocks
reportUnknownVariableType = false
reportUndefinedVariable = false
include = ["tests"]
exclude = ["tests/test_base.py"]

[[tool.pyright.executionEnvironments]]
root = "tests/test_base.py"
reportMissingTypeAnnotation = "error"
reportMissingParameterType = "error"
reportMissingReturnType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
include = ["tests/test_base.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["blinkapp", "blink_connection", "stream_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["blinkpy-source", ".git", "__pycache__", ".pytest_cache"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 10
timeout_method = "signal"
addopts = "--timeout=10 --tb=short --cov=blinkapp --cov-report=term-missing --cov-config=tests/.coveragerc --ignore=blinkpy-source"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "core: Core application tests (test_app.py)",
    "critical: Critical coverage tests (test_critical_coverage.py)",
    "boost: Coverage boost tests (test_coverage_boost.py)",
    "advanced: Advanced coverage tests"
]
filterwarnings = [
    'ignore:configuration option "asyncio_default_fixture_loop_scope" is unset',
]
