[tool.ruff]
# Ruff configuration for Blink Flask application
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B007", # loop control variable not used (common pattern)
]

[tool.pyright]
# Python version and environment
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

# Include and exclude paths
include = ["blinkapp", "tests"]
exclude = [
    "**/__pycache__",
    "venv",
    ".venv",
    "cache",
    "blinkpy-source"
]

# Type checking mode
typeCheckingMode = "standard"

# Use type stubs for blinkpy
stubPath = "types-blinkpy"

# Ignore third-party library issues
reportMissingImports = false
reportMissingTypeStubs = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["blinkapp", "blink_connection", "stream_manager"]
