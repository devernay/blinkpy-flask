[tool.ruff]
# Ruff configuration for Blink Flask application
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B007", # loop control variable not used (common pattern)
]

[tool.pyright]
# Python version
pythonVersion = "3.12"

# Exclude third-party directories and cache files
exclude = [
    "blinkpy/",
    "**/__pycache__",
    "**/.pytest_cache",
    "**/node_modules",
    ".venv/",
    "venv/"
]

# Ignore third-party library issues
reportMissingImports = false
reportMissingTypeStubs = false

# Reduce noise from third-party libraries while keeping strict checking for our code
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportUnknownParameterType = "warning"

# Keep strict checking for our application code
reportUntypedFunctionDecorator = true
reportUntypedClassDecorator = true
reportUntypedBaseClass = true
reportUntypedNamedTuple = true

# Allow some flexibility for test files
reportPrivateUsage = "warning"
reportConstantRedefinition = "warning"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["blinkapp", "blink_connection", "stream_manager"]
